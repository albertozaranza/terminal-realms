# Plano de Desenvolvimento — FASE 16: Mundo por Descoberta

> Status: **proposta para análise** (não iniciar implementação antes da aprovação).

## Decisões travadas

1. **Navegação:** grafo de descoberta. Visual rico de mapa (caixas, conexões, fog, portas 🔒) com viagem por seleção de locais conhecidos no menu. **Sem andar tile-a-tile** — respeita a spec.
2. **Layout do mapa:** coordenadas manuais no dado (`coord {col,row}`); renderer desenha caixas e conexões ortogonais. Sem engine de tiles.
3. **Escopo da 1ª entrega:** fatia vertical completa na **Região 1 (Bosque Sombrio)** — jogável fim-a-fim antes de expandir.

## Mudança arquitetural a aprovar

Hoje a progressão é **linear**: `WorldEngine.advance()` sorteia encontro e `systems/region.ts` avança por `REGION_ORDER`. Esta fase substitui isso por **navegação em grafo de locais**. É aditivo — combate, loot, XP, classes, save e i18n **não mudam de regra**, apenas ganham um novo orquestrador de mundo.

## Modelo conceitual — "Mapa-Constelação"

O mundo é um **grafo de POIs**. O jogador **viaja** para um local alcançável já descoberto (menu) — não anda pelo mapa. Visitar um local revela vizinhos (`?` → ícone); conversar com NPCs / concluir missões revela atalhos e destrava portas (🔒). Não-linear: múltiplas rotas, becos, locais opcionais, gates por conhecimento.

### Estados do local
`UNDISCOVERED ❓` · `DISCOVERED 🌲` · `AVAILABLE ⚔` · `COMPLETED ✅` · `LOCKED 🔒`

/* ===================== markdown renderer (read-only) ===================== */
function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function inlineMd(s){
  const codes=[];
  s=s.replace(/`([^`]+)`/g,(_,c)=>{ codes.push(c); return ""+(codes.length-1)+""; });
  s=escapeHtml(s);
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/(^|[^*])\*([^*\s][^*]*?)\*/g,"$1<em>$2</em>");
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,t,u)=>`<a href="${u}" target="_blank" rel="noreferrer">${t}</a>`);
  s=s.replace(/(\d+)/g,(_,i)=>`<code>${escapeHtml(codes[+i])}</code>`);
  return s;
}
function splitRow(line){ return line.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim()); }
function renderMarkdown(md){
  const lines=md.replace(/\r/g,"").split("\n"); let html="", i=0;
  while(i<lines.length){
    const line=lines[i];
    if(/^```/.test(line)){ i++; const b=[]; while(i<lines.length&&!/^```/.test(lines[i])){ b.push(lines[i]); i++; } i++; html+=`<pre><code>${escapeHtml(b.join("\n"))}</code></pre>`; continue; }
    if(/^\s*\|/.test(line)&&i+1<lines.length&&/^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(lines[i+1])){
      const head=splitRow(line); i+=2; const rows=[]; while(i<lines.length&&/^\s*\|/.test(lines[i])){ rows.push(splitRow(lines[i])); i++; }
      html+="<table><thead><tr>"+head.map(c=>`<th>${inlineMd(c)}</th>`).join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+r.map(c=>`<td>${inlineMd(c)}</td>`).join("")+"</tr>").join("")+"</tbody></table>"; continue;
    }
    const h=line.match(/^(#{1,6})\s+(.*)$/);
    if(h){ const lv=h[1].length; html+=`<h${lv}>${inlineMd(h[2])}</h${lv}>`; i++; continue; }
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)){ html+="<hr>"; i++; continue; }
    if(/^\s*>/.test(line)){ const b=[]; while(i<lines.length&&/^\s*>/.test(lines[i])){ b.push(lines[i].replace(/^\s*>\s?/,"")); i++; } html+=`<blockquote>${renderMarkdown(b.join("\n"))}</blockquote>`; continue; }
    if(/^\s*([-*+]|\d+\.)\s+/.test(line)){
      const ordered=/^\s*\d+\./.test(line); const items=[]; let cur=null;
      while(i<lines.length&&(/^\s*([-*+]|\d+\.)\s+/.test(lines[i])||/^\s{2,}\S/.test(lines[i]))){
        const m=lines[i].match(/^\s*(?:[-*+]|\d+\.)\s+(.*)$/);
        if(m){ if(cur!==null) items.push(cur); cur=m[1]; } else if(cur!==null){ cur+=" "+lines[i].trim(); }
        i++;
      }
      if(cur!==null) items.push(cur);
      html+=`<${ordered?"ol":"ul"}>`+items.map(x=>`<li>${inlineMd(x)}</li>`).join("")+`</${ordered?"ol":"ul"}>`; continue;
    }
    if(/^\s*$/.test(line)){ i++; continue; }
    const b=[line]; i++;
    while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^#{1,6}\s/.test(lines[i])&&!/^```/.test(lines[i])&&!/^\s*\|/.test(lines[i])&&!/^\s*([-*+]|\d+\.)\s+/.test(lines[i])&&!/^\s*>/.test(lines[i])){ b.push(lines[i]); i++; }
    html+=`<p>${inlineMd(b.join(" "))}</p>`;
  }
  return html;
}

/* ===================== app ===================== */
let VIEW="board";
const $=id=>document.getElementById(id);

function shortPhase(ph){ const f=PHASES[ph]||ph; const m=f.match(/FASE\s*(\d+)\s*[—-]\s*([^(]*)/); return m?("F"+m[1]+" · "+m[2].trim()):f; }

function renderTabs(){
  const tabs=[["board","📋 Board"],["plano","🗺️ Plano Fase 16"]];
  $("tabs").innerHTML=tabs.map(([k,l])=>
    `<div data-tab="${k}" class="px-3.5 py-2 rounded-t-lg cursor-pointer text-sm ${VIEW===k?'text-slate-100 bg-[#0d1017] border border-slate-700/60 border-b-0':'text-slate-400 hover:text-slate-200'}">${l}</div>`
  ).join("");
  $("tabs").querySelectorAll("[data-tab]").forEach(el=>el.onclick=()=>{ VIEW=el.dataset.tab; render(); });
}
function renderPhaseFilter(){
  const used=[...new Set(TASKS.map(t=>t.ph))];
  const opts=['<option value="">Todas as fases</option>'].concat(
    Object.keys(PHASES).filter(p=>used.includes(p)).map(p=>`<option value="${p}">${PHASES[p]}</option>`)
  );
  $("phase").innerHTML=opts.join("");
}
function renderStat(){
  const total=TASKS.length, done=TASKS.filter(t=>t.status==="done").length, prop=TASKS.filter(t=>t.status==="proposta").length;
  $("stat").innerHTML=`<b class="text-slate-200">${done}</b>/${total} concluídas · <b class="text-violet-300">${prop}</b> propostas`;
}

function renderBoard(){
  const q=($("search").value||"").toLowerCase().trim();
  const phf=$("phase").value;
  const list=TASKS.filter(t=>(!phf||t.ph===phf)&&(!q||t.id.toLowerCase().includes(q)||t.title.toLowerCase().includes(q)||(PHASES[t.ph]||"").toLowerCase().includes(q)));
  let html=`<div class="flex gap-4 px-5 py-4 h-full w-full">`;
  for(const key of COL_ORDER){
    const st=STATUS[key]; const items=list.filter(t=>t.status===key);
    html+=`<div class="bg-[#161a21] border border-slate-700/60 rounded-xl flex-1 min-w-0 flex flex-col max-h-full">
      <div class="flex items-center gap-2 px-4 py-3 border-b border-slate-700/60">
        <span class="w-2.5 h-2.5 rounded-full ${st.dot}"></span>
        <span class="font-semibold text-xs uppercase tracking-wider">${st.label}</span>
        <span class="ml-auto bg-[#232a35] text-slate-400 rounded-full px-2.5 text-xs py-0.5">${items.length}</span>
      </div>
      <div class="p-2.5 overflow-y-auto flex flex-col gap-2.5 scroll">`;
    if(!items.length) html+=`<div class="text-slate-600 text-center text-xs py-6">—</div>`;
    for(const t of items){
      html+=`<div data-id="${t.id}" class="task bg-[#1d222b] border border-slate-700/60 border-l-[3px] ${st.border} rounded-lg px-3 py-2.5 cursor-pointer hover:border-sky-500 transition">
        <div class="text-[11px] font-bold text-slate-400 tracking-wide">${t.id}</div>
        <div class="text-[13.5px] font-medium mt-1 mb-2">${escapeHtml(t.title)}</div>
        <div class="flex flex-wrap gap-1.5">
          <span class="text-[10.5px] px-2 py-0.5 rounded-full bg-[#232a35] text-sky-300">${escapeHtml(shortPhase(t.ph))}</span>
          ${t.deps?`<span class="text-[10.5px] px-2 py-0.5 rounded-full bg-[#232a35] text-violet-300">⛓ ${escapeHtml(t.deps)}</span>`:""}
        </div>
      </div>`;
    }
    html+=`</div></div>`;
  }
  html+=`</div>`;
  $("main").innerHTML=html;
  $("main").querySelectorAll(".task").forEach(el=>el.onclick=()=>openTask(el.dataset.id));
}
function renderDoc(){
  const md=$("doc-plano").textContent;
  $("main").innerHTML=`<div class="h-full overflow-y-auto scroll px-8 py-6"><div class="max-w-3xl mx-auto md">${renderMarkdown(md)}</div></div>`;
}
function render(){ renderTabs(); VIEW==="board"?renderBoard():renderDoc(); }

function openTask(id){
  const t=TASKS.find(x=>x.id===id); if(!t) return;
  const st=STATUS[t.status];
  $("m-id").textContent=t.id;
  $("m-title").textContent=t.title;
  $("m-meta").innerHTML=
    `<span class="text-[11px] px-2.5 py-0.5 rounded-full font-semibold ${st.chip}">${st.label}</span>`+
    `<span class="text-[11px] px-2.5 py-0.5 rounded-full bg-[#232a35] text-slate-400">${escapeHtml(PHASES[t.ph]||t.ph)}</span>`+
    (t.deps?`<span class="text-[11px] px-2.5 py-0.5 rounded-full bg-[#232a35] text-slate-400">⛓ depende: ${escapeHtml(t.deps)}</span>`:"");
  $("m-body").innerHTML=renderMarkdown(t.detail);
  $("overlay").classList.remove("hidden"); $("overlay").classList.add("flex");
}
function closeModal(){ $("overlay").classList.add("hidden"); $("overlay").classList.remove("flex"); }

$("m-close").onclick=closeModal;
$("overlay").onclick=e=>{ if(e.target.id==="overlay") closeModal(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });
$("search").oninput=()=>{ if(VIEW==="board") renderBoard(); };
$("phase").onchange=()=>{ if(VIEW==="board") renderBoard(); };

renderPhaseFilter(); renderStat(); render();
</script>
</body>
